name: Prepare Vercel staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation
        required: true
        default: verify
        type: choice
        options:
          - migration-only
          - seed-only
          - migrate-and-deploy
          - verify
      confirm_staging:
        description: Confirm this operation targets the isolated Staging database
        required: true
        default: false
        type: boolean

concurrency:
  group: vercel-staging-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply and inspect Staging migrations
    if: >-
      (github.event_name == 'push' && vars.STAGING_TARGET_READY == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.operation == 'migration-only' || inputs.operation == 'migrate-and-deploy') &&
       inputs.confirm_staging == true &&
       vars.STAGING_TARGET_READY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: vercel-staging
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      STAGING_TARGET_READY: ${{ vars.STAGING_TARGET_READY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: staging

      - name: Verify target configuration and exact current Staging SHA
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/staging" ]]; then
            echo "Staging migrations must be dispatched from the staging branch." >&2
            exit 1
          fi
          for name in DATABASE_URL_DIRECT STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID STAGING_NEON_PROJECT_ID STAGING_OPERATION_CONFIRMATION; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the vercel-staging environment." >&2
              exit 1
            fi
          done
          if [[ "${STAGING_TARGET_READY:-}" != "true" ]]; then
            echo "Set STAGING_TARGET_READY=true only after GitHub and Vercel Staging targets are configured and verified." >&2
            exit 1
          fi
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]]

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Apply guarded Staging migrations
        run: bun run db:migrate:staging

      - name: Audit Staging migration state
        run: bun run db:migrations:inspect -- --environment=vercel-staging

  seed:
    name: Seed the disposable Staging Admin
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'seed-only' &&
      inputs.confirm_staging == true &&
      vars.STAGING_TARGET_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      STAGING_TARGET_READY: ${{ vars.STAGING_TARGET_READY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: staging

      - name: Verify exact current Staging SHA and target readiness
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/staging" ]]; then
            echo "Staging seed must be dispatched from the staging branch." >&2
            exit 1
          fi
          for name in DATABASE_URL_DIRECT STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID STAGING_NEON_PROJECT_ID BETTER_AUTH_SECRET STAGING_ADMIN_EMAIL STAGING_ADMIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the vercel-staging environment." >&2
              exit 1
            fi
          done
          [[ "${STAGING_TARGET_READY:-}" == "true" ]]
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]]

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Seed guarded Staging Admin account
        run: bun run db:seed:staging-admin

  deploy:
    name: Build and deploy Staging after migrations
    needs: migrate
    if: >-
      (github.event_name == 'push' && vars.STAGING_TARGET_READY == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.operation == 'migrate-and-deploy' &&
       inputs.confirm_staging == true &&
       vars.STAGING_TARGET_READY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vercel-staging
    env:
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: staging

      - name: Verify exact current Staging SHA and Vercel configuration
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/staging" ]]; then
            echo "Staging deploy must be dispatched from the staging branch." >&2
            exit 1
          fi
          for name in HEALTHCHECK_SECRET VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the vercel-staging environment." >&2
              exit 1
            fi
          done
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]]

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Pull Vercel Custom Environment staging
        run: bunx vercel@57.0.0 pull --yes --environment=staging --token="$VERCEL_TOKEN"

      - name: Build Staging deployment
        run: bunx vercel@57.0.0 build --target=staging --token="$VERCEL_TOKEN"

      - name: Deploy the verified Staging build
        run: bunx vercel@57.0.0 deploy --prebuilt --target=staging --yes --token="$VERCEL_TOKEN"

      - name: Smoke the Staging alias
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "${STAGING_ORIGIN}/api/health/ready" > /dev/null
          webhook_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${STAGING_ORIGIN}/api/webhooks/resend")"
          [[ "${webhook_status}" == "400" ]]

  verify:
    name: Verify current Staging deployment
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
    steps:
      - name: Smoke Staging
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "${STAGING_ORIGIN}/api/health/ready" > /dev/null
          webhook_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${STAGING_ORIGIN}/api/webhooks/resend")"
          [[ "${webhook_status}" == "400" ]]
